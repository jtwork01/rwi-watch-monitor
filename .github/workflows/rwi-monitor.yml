name: RWI Watch Monitor

on:
  schedule:
    - cron: '2-57/5 * * * *'

  workflow_dispatch:
    inputs:
      send_test_notification:
        description: 'Send an ntfy test notification before checking RWI'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rwi-watch-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 4

    env:
      RWI_USERNAME: ${{ secrets.RWI_USERNAME }}
      RWI_PASSWORD: ${{ secrets.RWI_PASSWORD }}
      RWI_SESSION_KEY: ${{ secrets.RWI_SESSION_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      SELLER_USERNAME: soyla355

      ENABLE_MARKETPLACE_TEST: ${{ vars.ENABLE_MARKETPLACE_TEST || 'true' }}

    steps:

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      - name: Install small browser-control dependency
        run: npm install --no-audit --no-fund


      - name: Confirm Chrome is available
        run: |
          which google-chrome || \
          which google-chrome-stable || \
          which chromium || \
          which chromium-browser

          google-chrome --version 2>/dev/null || true


      # -------------------------------------------------------
      # TEMPORARY RSS TEST
      #
      # We already know GitHub's browser is being shown
      # Cloudflare's "Just a moment..." page.
      #
      # This checks whether RWI's XenForo RSS endpoint can
      # bypass that problem and return the actual marketplace
      # feed.
      # -------------------------------------------------------

      - name: Test RWI marketplace RSS
        shell: bash
        run: |
          echo "========================================"
          echo "TESTING RWI MARKETPLACE RSS"
          echo "========================================"

          RSS_URL="https://forum.replica-watch.info/forums/replica-genuine-watch-sales.9951900/index.rss"

          echo "URL:"
          echo "$RSS_URL"
          echo ""

          curl \
            -L \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36" \
            --connect-timeout 15 \
            --max-time 30 \
            -D /tmp/rwi-rss-headers.txt \
            -o /tmp/rwi-rss.txt \
            -w "HTTP STATUS: %{http_code}\nFINAL URL: %{url_effective}\nCONTENT TYPE: %{content_type}\n" \
            "$RSS_URL" || true

          echo ""
          echo "========================================"
          echo "RESPONSE HEADERS"
          echo "========================================"

          cat /tmp/rwi-rss-headers.txt 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "FIRST 60 LINES OF RESPONSE"
          echo "========================================"

          head -60 /tmp/rwi-rss.txt 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "RSS DIAGNOSTIC"
          echo "========================================"

          if grep -qiE "<rss|<feed|<channel" /tmp/rwi-rss.txt 2>/dev/null; then
            echo "SUCCESS: RWI returned what appears to be a real RSS/XML feed."
          elif grep -qiE "just a moment|cloudflare|verify you are human|checking your browser" /tmp/rwi-rss.txt 2>/dev/null; then
            echo "BLOCKED: Cloudflare intercepted the RSS request."
          else
            echo "UNKNOWN: Response was neither obvious RSS nor an obvious Cloudflare challenge."
          fi


      - name: Restore encrypted RWI browser session
        shell: bash
        run: |
          mkdir -p .private .runtime

          if [ -f .private/auth.enc ]; then

            if [ -z "$RWI_SESSION_KEY" ]; then
              echo "RWI_SESSION_KEY secret is missing."
              exit 1
            fi

            if ! openssl enc \
              -d \
              -aes-256-cbc \
              -pbkdf2 \
              -in .private/auth.enc \
              -out .private/auth.json \
              -pass env:RWI_SESSION_KEY
            then
              echo "Saved session could not be decrypted."
              echo "Monitor will attempt to log into RWI again."

              rm -f .private/auth.json
            fi

          fi


      - name: Send manual notification test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_notification }}
        run: node monitor.mjs --test-notification


      - name: Check RWI
        run: node monitor.mjs


      - name: Encrypt refreshed RWI browser session
        if: ${{ always() }}
        shell: bash
        run: |

          if [ -f .runtime/auth-updated ] && [ -f .private/auth.json ]; then

            if [ -z "$RWI_SESSION_KEY" ]; then
              echo "RWI_SESSION_KEY secret is missing."
              exit 1
            fi

            openssl enc \
              -aes-256-cbc \
              -pbkdf2 \
              -salt \
              -in .private/auth.json \
              -out .private/auth.enc \
              -pass env:RWI_SESSION_KEY

          fi

          rm -f .private/auth.json
          rm -f .runtime/auth-updated


      - name: Persist monitor state and encrypted session
        if: ${{ always() }}
        shell: bash
        run: |

          git config user.name "rwi-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if [ -f .private/auth.enc ]; then
            git add .private/auth.enc
          fi

          if git diff --cached --quiet; then
            echo "No state changes to save."
            exit 0
          fi

          git commit -m "Update RWI monitor state [skip ci]"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
